[package]
name = "gozpak-repo"
description = "gozpak (Rust rewrite, M1): repo.index parse/serialize + repo URL configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# TSV repo.index is plain (std string handling), but the v1.2 binary-repo
# index (index.json) needs serde_json; serde/derive is confined to this
# crate for the BinaryEntry schema.
[dependencies]
gozpak-core = { path = "../gozpak-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# M2b: ed25519 index signing/verification. Pinned-exact chain kept MSRV-safe
# (dalek 2.2's chain is MSRV 1.60-era); this is the ONLY new external crate
# in M2b. The `rand_core` feature enables `SigningKey::generate` (keygen).
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }
