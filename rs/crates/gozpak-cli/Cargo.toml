[package]
name = "gozpak-cli"
description = "gozpak (Rust rewrite, M1): the gozpak binary — version/list/search/checksum + stubs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "gozpak_cli"
path = "src/lib.rs"

[[bin]]
name = "gozpak"
path = "src/main.rs"

[dependencies]
gozpak-core = { path = "../gozpak-core" }
gozpak-recipe = { path = "../gozpak-recipe" }
gozpak-repo = { path = "../gozpak-repo" }
gozpak-build = { path = "../gozpak-build" }
# M2b: the install side (unpack + verify + install + hooks + DB).
gozpak-install = { path = "../gozpak-install" }

[dev-dependencies]
gozpak-core = { path = "../gozpak-core" }
